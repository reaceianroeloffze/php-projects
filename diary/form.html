<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta name="keywords" content="Diary">
        <meta name="author" content="Reace Ian Roeloffze">
        <meta name="description" content="Diary App">
        <link rel="stylesheet" href="styles/modern-normalize.css" type="text/css">
        <link rel="stylesheet" href="styles/small.css" type="text/css">
        <link rel="stylesheet" href="styles/medium.css" type="text/css">
        <link rel="stylesheet" href="styles/large.css" type="text/css">
        <title>Homepage | Diary</title>
    </head>
    <body>
        <!-- Set the navigation bar -->
        <nav class="site-navigation">
            <!-- Create a container for the navigation bar -->
            <div class="container">
                <!-- Create a layout for the navigation bar -->
                <div class="site-navigation-layout">
                    <!-- Create the logo and homepage link -->
                    <a href="index.html"
                       title="Go to homepage"
                       class="site-navigation__homepage-link"
                    >
                        <!-- Logo -->
                        <img src="images/journal-logo.svg"
                             alt="Logo of a journal"
                             class="homepage-link__logo"
                        >
                        My Diary
                    </a>
                    <!-- Create new entry button link -->
                    <a class="new-entry-btn site-btn"
                       href="form.html"
                       title="Add new journal entry"
                    >
                        ➕ New Journal Entry
                    </a>
                </div>
            </div>
        </nav>
        <!-- Main content -->
        <main class="main-content main-content--form">
            <div class="container container--form">
                <h1 class="page-title">New Journal Entry</h1>
                <form method="POST"
                      action="form.html"
                      class="site-form"
                >
                    <label class="site-form__label">Entry Title:
                        <input type="text"
                               class="site-form__input"
                               name="title"
                               title="Title of your new journal entry"
                        >
                    </label>
                    <label class="site-form__label">Entry Date:
                        <input type="date"
                               class="site-form__input"
                               name="date"
                               title="Date of your new journal entry"
                        >
                    </label>
                    <label class="site-form__label">What's on your mind?
                        <textarea name="content"
                                  rows="10"
                                  class="site-form__textarea"
                                  title="Share whatever you like"
                        ></textarea>
                    </label>
                    <!-- Form submit button -->
                    <button class="site-form__submit-btn site-btn"
                            type="submit"
                            title="Submit a new journal entry"
                    >
                        📔 Add New Journal Entry
                    </button>
                </form>
            </div>
        </main>
        <!-- Site footer -->
        <footer class="site-footer">
            <div class="container site-footer__container">
                <h3 class="site-footer__heading">PHP Diary</h3>
                <p class="site-footer__description">
                    This is a PHP diary app one can use to keep track of their learning journey through PHP.
                </p>
                <p class="site-footer__last-updated">
                    Last updated:
                    <span class="last-updated__year"></span>
                </p>
            </div>
        </footer>
    </body>
</html>
